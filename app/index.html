<!DOCTYPE html>
<html lang="en" dir="ltr" class="ready">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta http-equiv="Content-Language" content="en">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="HandheldFriendly" content="true">
<meta name="MobileOptimized" content="320">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kali Terminal">
<meta name="application-name" content="Kali Terminal">
<meta name="msapplication-TileColor" content="#000000">
<meta name="msapplication-navbutton-color" content="#000000">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta name="referrer" content="strict-origin">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<meta http-equiv="Cache-Control" content="public, max-age=31536000, immutable">
<meta http-equiv="Pragma" content="cache">
<meta http-equiv="Expires" content="31536000">
<title>Kali Linux Light</title>
<meta name="description" content="A lightweight Kali-style terminal interface with broad browser compatibility.">
<meta name="keywords" content="Kali, terminal, Linux, shell, web terminal, lightweight">
<link rel="canonical" href="">
<link rel="stylesheet" href="style.css?v=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil:wght@700;800;900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap&v=1" rel="stylesheet">
<script src="policy.js?v=1"></script>
<script src="loading.js?v=1"></script>
<noscript>
<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;color:#fff;font-family:Arial,sans-serif;text-align:center;padding:24px;z-index:99999999999999;">
<div>
<h1>JavaScript Required</h1>
<p>LIGHT KALI requires JavaScript to run correctly.</p>
</div>
</div>
</noscript>
</head>
<body>
<div class="bg" id="bgLayer" aria-hidden="true"></div>
<main class="app" id="app" role="main" aria-label="Kali terminal interface">
<section class="screen" id="screen" aria-label="Terminal transcript">
<div class="transcript" id="transcript" role="log" aria-live="polite" aria-relevant="additions text">
<div class="command-line" id="commandLine">
<div class="prompt-top" id="promptTop"></div>
<div class="prompt-row">
<span class="prompt-bottom" id="promptBottom">└─$</span>
<span class="input-holder" id="inputHolder">
<span class="mirror" id="mirror"></span>
<input id="termInput" class="term-input" type="text" inputmode="text" aria-label="Terminal command input" enterkeyhint="send" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
<span class="fake-caret" id="fakeCaret" aria-hidden="true"></span>
</span>
</div>
</div>
</div>
<div class="sr-only" id="screenStatus" aria-live="polite"></div>
</section>
</main>
<script src="bios.js?v=1"></script>
<script src="pkg.js?v=1" defer></script>
<script src="install.js?v=1" defer></script>
<script src="core.js?v=1" defer></script>
<script src="commands.js?v=1" defer></script>
<script src="app.js?v=1" defer></script>
<script src="FreeUserProxy.js?v=1" defer></script>
</body>
</html>
