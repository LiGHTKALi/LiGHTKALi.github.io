<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Developer Center</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #111;
      --surface2: #161616;
      --surface3: #1c1c1c;
      --border: #2a2a2a;
      --border2: #3a3a3a;
      --text: #f0f0f0;
      --muted: #999;
      --muted2: #777;
      --white: #fff;
      --black: #000;
      --radius: 8px;
      --radius-sm: 6px;
      --radius-pill: 20px;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.35);
      --transition: 0.18s ease;
      --mono: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace;
      --sans: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  height: 100%;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.wrap {
  min-height: 100%;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 16px;
}

.page {
  width: min(1500px, 100%);
  display: grid;
  gap: 14px;
}

.mast,
.panel {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow);
}

.mast {
  display: grid;
  gap: 10px;
  padding: 20px 16px 18px;
}

.eyebrow {
  font-family: var(--mono);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-size: 11px;
  color: var(--muted);
}

h1 {
  margin: 0;
  font-size: clamp(30px, 5vw, 58px);
  line-height: 0.95;
  letter-spacing: -0.04em;
  font-weight: 900;
  text-transform: uppercase;
  color: var(--white);
}

h1 span {
  opacity: 0.82;
}

.desc {
  max-width: 980px;
  color: var(--muted);
  line-height: 1.95;
  font-size: 13px;
  display: grid;
  gap: 8px;
}

.desc strong {
  color: var(--white);
  font-weight: 800;
}

.desc .hl {
  color: var(--white);
  background: #1c1c1c;
  padding: 2px 8px;
  border-radius: 4px;
  border: 1px solid var(--border);
  display: inline-block;
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: flex-start;
  padding: 12px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface2);
  box-shadow: var(--shadow-sm);
}

.toolbar-left {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  border: 1px solid var(--border);
  background: var(--black);
  font-family: var(--mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  white-space: nowrap;
  border-radius: var(--radius-pill);
  color: #d9d9d9;
}

.badge .dot {
  width: 7px;
  height: 7px;
  background: var(--white);
  border-radius: 50%;
}

.lang-btn {
  appearance: none;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  padding: 6px 10px;
  font: 700 10px/1 var(--mono);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  cursor: pointer;
  border-radius: 14px;
  min-height: 30px;
  transition: color var(--transition), border-color var(--transition), background var(--transition), transform var(--transition);
}

.lang-btn:hover {
  border-color: var(--border2);
  color: var(--text);
  background: var(--surface3);
  transform: translateY(-1px);
}

.lang-btn:active {
  transform: translateY(0) scale(0.98);
}

.lang-btn.active {
  border-color: var(--white);
  color: var(--white);
  background: var(--surface3);
}

.grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
}

.sectionHead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--surface2);
  font-family: var(--mono);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-size: 12px;
  font-weight: 700;
}

.sectionHead .sub {
  color: var(--muted2);
  font-size: 10px;
  letter-spacing: 0.02em;
  text-transform: none;
  white-space: nowrap;
}

.panelBody {
  padding: 16px;
  display: grid;
  gap: 12px;
}

.notice {
  border: 1px solid var(--border);
  background: #0f0f0f;
  border-radius: var(--radius-sm);
  padding: 14px;
  display: grid;
  gap: 10px;
}

.notice p {
  color: var(--text);
  line-height: 1.9;
  font-size: 13px;
}

.notice .muted {
  color: var(--muted);
}

.sampleGrid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.sampleCard {
  border: 1px solid var(--border);
  background: var(--bg);
  border-radius: var(--radius-sm);
  overflow: hidden;
  display: grid;
  min-width: 0;
}

.sampleTop {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  background: var(--surface2);
}

.sampleName {
  font-family: var(--mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 900;
  color: var(--white);
}

.sampleCopy {
  appearance: none;
  border: 1px solid var(--border);
  background: var(--surface);
  color: #ddd;
  padding: 6px 12px;
  cursor: pointer;
  border-radius: 14px;
  font: 700 10px/1 var(--mono);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  min-height: 32px;
  transition: transform var(--transition), background var(--transition), border-color var(--transition), color var(--transition);
  white-space: nowrap;
}

.sampleCopy:hover {
  background: #1e1e1e;
  border-color: var(--white);
  color: var(--white);
  transform: translateY(-1px);
}

.sampleCopy:active {
  transform: translateY(0) scale(0.98);
}

.sampleCopy:focus-visible,
.lang-btn:focus-visible {
  outline: 2px solid var(--white);
  outline-offset: 2px;
}

pre.code {
  margin: 0;
  padding: 14px;
  overflow: auto;
  color: #e8e8e8;
  background: var(--bg);
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.85;
  white-space: pre;
  tab-size: 2;
  min-height: 170px;
  border-top: 0;
}

.sampleMeta {
  padding: 0 14px 14px;
  display: grid;
  gap: 8px;
  border-top: 1px solid rgba(255, 255, 255, 0.06);
  background: var(--bg);
}

.sampleMeta p {
  font-size: 12px;
  line-height: 1.8;
  color: var(--muted);
}

.sampleMeta .cap {
  color: var(--white);
  font-family: var(--mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 700;
}

.linksGrid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.linkCard {
  border: 1px solid var(--border);
  background: var(--bg);
  border-radius: var(--radius-sm);
  padding: 14px;
  display: grid;
  gap: 10px;
}

.linkTitle {
  font-family: var(--mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 900;
  color: var(--white);
}

.linkCard p {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.9;
}

.linkCard a {
  color: var(--white);
  text-decoration: none;
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.8;
  word-break: break-word;
  border: 1px solid var(--border);
  background: var(--surface);
  padding: 10px 12px;
  border-radius: 14px;
  transition: background var(--transition), border-color var(--transition), transform var(--transition);
}

.linkCard a:hover {
  background: var(--surface3);
  border-color: var(--white);
  transform: translateY(-1px);
}

.footer {
  padding: 14px 16px;
  color: var(--muted2);
  font-family: var(--sans);
  font-size: 11px;
  line-height: 1.9;
  border-top: 1px solid var(--border);
  background: var(--bg);
  text-align: center;
  border-radius: 0 0 var(--radius) var(--radius);
}

@media (max-width: 1100px) {
  .sampleGrid,
  .linksGrid {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 640px) {
  .wrap {
    padding: 8px;
  }

  .toolbar {
    padding: 10px;
  }

  .panelBody {
    padding: 12px;
  }

  .sectionHead {
    padding: 12px 14px;
  }

  pre.code {
    font-size: 11px;
    min-height: 150px;
  }
}

::selection {
  background: var(--white);
  color: var(--black);
}

* {
  scrollbar-color: #444 var(--surface);
}

::-webkit-scrollbar {
  width: 7px;
  height: 7px;
}

::-webkit-scrollbar-track {
  background: var(--surface);
}

::-webkit-scrollbar-thumb {
  background: #444;
  border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
  background: #555;
}

  </style>
</head>

  window[KEY] = Object.freeze({
    manifest: Object.freeze({
      name: 'notifier-lite',
      version: '1.0.0',
      description: 'Notification helper',
      author: 'Developer',
      permissions: Object.freeze({
        storage: 'none',
        cookies: 'none',
        network: 'none',
        filesystem: 'none'
      })
    }),

    install(api) {
      api.append([
        api.line('Notifier ready.', 'accent')
      ]);
    },

    uninstall(api) {
      api.append([
        api.line('Notifier removed.', 'muted')
      ]);
    }
  });
})();`
        }
      ];

      const dom = {
        eyebrow: document.getElementById('eyebrow'),
        title: document.getElementById('title'),
        description: document.getElementById('description'),
        badge: document.getElementById('badge'),
        sampleTitle: document.getElementById('sampleTitle'),
        sampleSub: document.getElementById('sampleSub'),
        devTitle: document.getElementById('devTitle'),
        devSub: document.getElementById('devSub'),
        sampleGrid: document.getElementById('sampleGrid'),
        devNotice: document.getElementById('devNotice'),
        linkGrid: document.getElementById('linkGrid'),
        footer: document.getElementById('footer'),
        langBtns: [...document.querySelectorAll('.lang-btn')]
      };

      const RTL_LANGS = new Set(['fa']);
      const SUPPORTED_LANGS = ['en', 'fa', 'ru'];
      let currentLang = 'en';

      function setLanguage(lang) {
        if (!SUPPORTED_LANGS.includes(lang)) return;
        currentLang = lang;
        try {
          localStorage.setItem('developer-center-lang', lang);
        } catch {}
        refresh();
      }

      function makeSampleCard(item, index) {
        const t = TRANSLATIONS[currentLang] || TRANSLATIONS.en;

        const card = document.createElement('article');
        card.className = 'sampleCard';

        const top = document.createElement('div');
        top.className = 'sampleTop';

        const name = document.createElement('div');
        name.className = 'sampleName';
        name.textContent = `${index + 1}. ${item.name}`;

        const copy = document.createElement('button');
        copy.className = 'sampleCopy';
        copy.type = 'button';
        copy.textContent = t.copy;
        copy.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(item.code);
            copy.textContent = t.copied;
            setTimeout(() => {
              copy.textContent = t.copy;
            }, 1200);
          } catch {
            copy.textContent = t.failed;
            setTimeout(() => {
              copy.textContent = t.copy;
            }, 1200);
          }
        });

        top.appendChild(name);
        top.appendChild(copy);

        const pre = document.createElement('pre');
        pre.className = 'code';
        pre.textContent = item.code;

        const meta = document.createElement('div');
        meta.className = 'sampleMeta';

        const cap = document.createElement('div');
        cap.className = 'cap';
        cap.textContent = `${item.name} • ${item.version}`;

        const feature = document.createElement('p');
        feature.textContent = t.sampleLabels[item.featureIndex] + ' — ' + t.sampleFeatures[item.featureIndex];

        meta.appendChild(cap);
        meta.appendChild(feature);

        card.appendChild(top);
        card.appendChild(pre);
        card.appendChild(meta);

        return card;
      }

      function refreshSamples() {
        dom.sampleGrid.textContent = '';
        const frag = document.createDocumentFragment();
        SAMPLE_PACKAGES.forEach((item, idx) => frag.appendChild(makeSampleCard(item, idx)));
        dom.sampleGrid.appendChild(frag);
      }

      function refresh() {
        const t = TRANSLATIONS[currentLang] || TRANSLATIONS.en;

        dom.eyebrow.textContent = t.eyebrow;
        dom.title.innerHTML = t.title;
        dom.badge.textContent = t.badge;
        dom.sampleTitle.textContent = t.sampleTitle;
        dom.sampleSub.textContent = t.sampleSub;
        dom.devTitle.textContent = t.devTitle;
        dom.devSub.textContent = t.devSub;
        dom.footer.textContent = t.footer;

        dom.description.textContent = '';
        const p = document.createElement('p');
        p.innerHTML = t.description;
        dom.description.appendChild(p);

        document.documentElement.lang = currentLang;
        document.documentElement.dir = RTL_LANGS.has(currentLang) ? 'rtl' : 'ltr';

        dom.langBtns.forEach(btn => {
          btn.classList.toggle('active', btn.dataset.lang === currentLang);
        });

        dom.devNotice.textContent = '';
        for (const line of t.notes) {
          const pLine = document.createElement('p');
          if (line.includes('https://')) {
            pLine.innerHTML = line;
          } else {
            pLine.textContent = line;
          }
          dom.devNotice.appendChild(pLine);
        }

        dom.linkGrid.textContent = '';

        const links = [
          {
            title: t.linkRulesTitle,
            text: t.linkRulesText,
            url: 'https://LiGHTKALi.github.io/license'
          },
          {
            title: t.linkBuyTitle,
            text: t.linkBuyText,
            url: 'https://LiGHTKALi.github.io/buy'
          }
        ];

        for (const item of links) {
          const card = document.createElement('div');
          card.className = 'linkCard';

          const title = document.createElement('div');
          title.className = 'linkTitle';
          title.textContent = item.title;

          const pText = document.createElement('p');
          pText.textContent = item.text;

          const a = document.createElement('a');
          a.href = item.url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.textContent = item.url;

          card.appendChild(title);
          card.appendChild(pText);
          card.appendChild(a);
          dom.linkGrid.appendChild(card);
        }

        refreshSamples();
      }

      function init() {
        try {
          const saved = localStorage.getItem('developer-center-lang');
          if (saved && SUPPORTED_LANGS.includes(saved)) {
            currentLang = saved;
          } else {
            const browserLang = (navigator.language || 'en').slice(0, 2).toLowerCase();
            currentLang = SUPPORTED_LANGS.includes(browserLang) ? browserLang : 'en';
          }
        } catch {
          currentLang = 'en';
        }

        dom.langBtns.forEach(btn => {
          btn.addEventListener('click', () => setLanguage(btn.dataset.lang));
        });

        refresh();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script></body>
        </html>
