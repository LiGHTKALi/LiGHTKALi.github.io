<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تست پروکسی کلاودفلر</title>
    <style>
        body { font-family: Tahoma, Arial, sans-serif; background: #1e1e1e; color: #fff; padding: 20px; text-align: center; }
        .box { background: #2d2d2d; border-radius: 8px; padding: 20px; margin: 20px auto; max-width: 600px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        #status { font-size: 1.2em; font-weight: bold; margin-bottom: 15px; }
        .success { color: #4caf50; }
        .error { color: #f44336; }
        pre { background: #111; padding: 15px; border-radius: 5px; text-align: left; direction: ltr; overflow-x: auto; font-size: 0.9em; color: #0f0; }
    </style>
</head>
<body>

    <div class="box">
        <h2>🚀 تست پروکسی CORS اختصاصی</h2>
        <p>دامنه مجاز: <code>lightkali.github.io</code></p>
        <div id="status">⏳ در حال ارسال درخواست...</div>
        <pre id="result">منتظر پاسخ...</pre>
    </div>

    <script>
        // ==========================================
        // ⚠️ مرحله ۱: آدرس ورکر خود را دقیقاً اینجا جایگزین کنید
        // ==========================================
        const WORKER_URL = 'https://proxy.kalilightstudio.workers.dev'; // <-- آدرس خود را اینجا بگذارید
        
        // یک API تستی استاندارد و سبک
        const TARGET_API = 'https://jsonplaceholder.typicode.com/todos/1';

        // ساخت آدرس نهایی پروکسی
        const finalUrl = `${WORKER_URL}/?url=${encodeURIComponent(TARGET_API)}`;

        console.log("در حال درخواست به:", finalUrl);

        fetch(finalUrl)
            .then(response => {
                if (!response.ok) {
                    throw new Error(`خطای HTTP: کد وضعیت ${response.status} - ${response.statusText}`);
                }
                return response.json();
            })
            .then(data => {
                // حالت موفقیت
                document.getElementById('status').innerHTML = '✅ موفقیت! پروکسی به درستی کار می‌کند و CORS دور زده شد.';
                document.getElementById('status').className = 'success';
                document.getElementById('result').textContent = JSON.stringify(data, null, 2);
            })
            .catch(error => {
                // حالت خطا
                document.getElementById('status').innerHTML = `❌ خطا! پروکسی کار نکرد.<br><small>${error.message}</small>`;
                document.getElementById('status').className = 'error';
                document.getElementById('result').textContent = error.message;
            });
    </script>

</body>
</html>
